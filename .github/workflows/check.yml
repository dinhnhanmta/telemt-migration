name: Recovery checks
on:
  push:
    branches: [main]
    paths: ['**.py', 'install.sh', '.github/workflows/check.yml']
  pull_request:
jobs:
  recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - run: bash -n install.sh
      - run: sudo /usr/bin/python3 -m unittest discover -s tests -v
